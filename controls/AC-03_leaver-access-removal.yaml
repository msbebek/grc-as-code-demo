id: AC-03
title: Access removal for leavers
owner: People team and IT Operations
frequency: event-driven
type: preventive
automation: partial
description: >
  When HR records a termination, access to all in-scope applications is removed within 2 business days.
test_procedure:
  - Sample leavers from the HR system for the period.
  - Compare termination date with account deactivation date in each application.
evidence:
  - HR leaver list
  - Deactivation timestamps per application
mappings:
  soc2: [CC6.2]
  iso27001: ["5.18", "6.5"]
